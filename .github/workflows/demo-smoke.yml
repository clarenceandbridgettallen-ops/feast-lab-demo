name: Feast Lab demo smoke
on:
  push:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/demo-smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/demo-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free Node smoke tests
        run: node --test tests/*.test.mjs
